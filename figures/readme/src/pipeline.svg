<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"><rect x="1.0" y="1.0" width="1198.0" height="338.0" rx="14" fill="#FFFFFF" stroke="#E2DCDF"/><text x="40.0" y="52.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#231F22" text-anchor="start">How the analysis runs</text><text x="40.0" y="80.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6F6670" text-anchor="start">Six stages from reads to results; the badge shows where each stage lives</text><rect x="40.0" y="120.0" width="172.0" height="150.0" rx="10" fill="#F6F1F3" stroke="none"/><circle cx="70.0" cy="150.0" r="16" fill="#A23B4F" stroke="none" stroke-width="2"/><text x="70.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="56.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#231F22" text-anchor="start">Sequence and count</text><text x="56.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F6670" text-anchor="start">TAG-seq, STAR,</text><text x="56.0" y="238.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F6670" text-anchor="start">featureCounts</text><rect x="56.0" y="286.0" width="140.0" height="26.0" rx="13" fill="#6F6670" stroke="none"/><text x="126.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">external</text><line x1="214.0" y1="195.0" x2="218.0" y2="195.0" stroke="#6F6670" stroke-width="2"/><path d="M226.0 195.0 l-10 -6 l0 12 z" fill="#6F6670"/><rect x="228.0" y="120.0" width="172.0" height="150.0" rx="10" fill="#F6F1F3" stroke="none"/><circle cx="258.0" cy="150.0" r="16" fill="#A23B4F" stroke="none" stroke-width="2"/><text x="258.0" y="156.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fo