# GRBV extended pipeline — FARM config

inputs:
  counts: data/counts_matrix.txt
  metadata: data/sample_metadata.txt
  titer: data/Virus_titer.txt
  modules_xlsx: data/Module_genes.xlsx
  mes_csv: data/MEs.csv
  weather_2021: data/daily_2021.csv
  weather_2022: data/daily_2022.csv

resources_dir: resources
results_dir: results

filtering:
  min_count: 10
  min_fraction: 0.10
  top_variable_genes: 5000

grn:
  n_trees: 1000
  top_edges_export: 100000

module_preservation:
  n_permutations: 100
  soft_power: 6

subtype_nmf:
  k_range: [2, 3, 4, 5, 6]
  n_bootstrap: 50
  n_top_var: 2000

diffcoex:
  n_perm: 100
  top_var: 3000

motif_enrichment:
  promoter_upstream_bp: 1500
  fimo_qvalue: 0.05

pseudotime:
  top_var: 3000
  n_knots: 6

mofa:
  n_factors: 10
  n_iter: 1000
  top_var_expr: 3000

hima:
  top_var: 3000
  n_perm: 100

meta_analysis:
  padj_thresh: 0.05          # significance cutoff for DEG classification
  lfc_thresh:  1.0           # |log2FC| cutoff

# Actual sampling dates (ISO yyyy-mm-dd). Used to build per-sample weather windows.
sampling_dates:
  "2021|Pre_veraison":  2021-08-02
  "2021|Veraison":      2021-08-16
  "2021|Post_veraison": 2021-09-08
  "2021|Harvest":       2021-09-21
  "2022|Pre_veraison":  2022-07-26
  "2022|Veraison":      2022-08-09
  "2022|Post_veraison": 2022-08-24
  "2022|Harvest":       2022-09-13

weather_window:
  days_before: 14          # window length before sampling date
  base_temp_gdd: 10        # GDD base temperature (°C)

genome:
  ncbi_accession: GCF_030704535.1
  assembly_name: "PN40024_v4"

tf_db:
  planttfdb_url: "http://planttfdb.gao-lab.org/download/TF_list/Vvi_TF_list.txt.gz"

motif_db:
  jaspar_plants_url: "https://jaspar.genereg.net/download/data/2024/CORE/JASPAR2024_CORE_plants_non-redundant_pfms_meme.txt"
